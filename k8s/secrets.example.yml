# Klartextvorlage fuer sealed-secret.yml. Jeden Wert mit kubeseal versiegeln:
#
#   echo -n 'super-secret' | kubeseal --raw --name erfolgsgeschichten \
#     --namespace hackathon-vibe --cert public-key.pem
#
# und das Ergebnis in spec.encryptedData von sealed-secret.yml eintragen.
#
# Diese Datei wird NICHT ausgerollt (nicht in kustomization.yml) und enthaelt
# keine echten Werte.
apiVersion: v1
kind: Secret
metadata:
  name: erfolgsgeschichten
  namespace: hackathon-vibe
type: Opaque
stringData:
  # Signiert das Sitzungscookie. Beim Wechsel sind alle Anmeldungen hinfaellig.
  #   openssl rand -base64 48
  SESSION_SECRET: "replace-with-random-secret"

  # Aus Keycloak: Clients -> erfolgsgeschichten -> Credentials.
  KEYCLOAK_CLIENT_SECRET: "replace-with-keycloak-client-secret"

  # Der KI-Zugang. Im Mehrbenutzerbetrieb der EINZIGE Weg (I-08): Ein
  # Schluessel in der Datenbank waere fuer jeden lesbar, der die Datei in die
  # Hand bekommt, und ueber die Oberflaeche koennte ihn jeder Kollege
  # austauschen.
  ANTHROPIC_API_KEY: "sk-ant-replace-me"

  # Azure OpenAI, sobald es einen Endpunkt gibt (O-04). Dann zusaetzlich in
  # config.yml: AZURE_OPENAI_ENDPUNKT und AZURE_OPENAI_DEPLOYMENT.
  # AZURE_OPENAI_KEY: ""
