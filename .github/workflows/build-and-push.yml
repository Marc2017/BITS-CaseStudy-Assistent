# Bauen und nach Harbor schieben.
#
# Uebernommen aus BITS-GmbH/bits-burn (Rat von Florian Wenzel, 07.10.2026).
# Abweichung: ein Image statt zwei - der Node-Server liefert das Frontend
# selbst aus (siehe Dockerfile).
name: build and push image to harbor

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: [generic, on-prem]
    steps:
      - name: Login to Harbor
        run: echo "${{ secrets.HARBOR_SECRET }}" | docker login https://harbor.mybits.dev -u '${{ secrets.HARBOR_USER }}' --password-stdin

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image tags
        id: vars
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${short_sha}"
          fi
          tags=$'harbor.mybits.dev/erfolgsgeschichten/app:'"${tag}"$'\nharbor.mybits.dev/erfolgsgeschichten/app:latest'
          {
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
